<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packlight — voice-first minimalist packing</title>
<meta name="description" content="Talk your way to a lighter bag. Packlight builds a weather-aware, minimalist packing checklist you can check off by voice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235ee0a0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 7.5V6a3 3 0 0 1 6 0v1.5'/%3E%3Crect x='5' y='7.5' width='14' height='13.5' rx='4'/%3E%3Cpath d='M5 12.5h14'/%3E%3Crect x='9.2' y='14.5' width='5.6' height='3.6' rx='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 7.5V6a3 3 0 0 1 6 0v1.5"/>
      <rect x="5" y="7.5" width="14" height="13.5" rx="4"/>
      <path d="M5 12.5h14"/>
      <rect x="9.2" y="14.5" width="5.6" height="3.6" rx="1.4"/>
    </svg>
    <div>
      <h1>Packlight</h1>
      <p class="tagline">talk your way to a lighter bag</p>
    </div>
  </div>
  <button id="reset-btn" title="Start a new trip">new trip</button>
</header>

<main>
  <section id="conversation">
    <div id="log"></div>
    <p id="assistant-line" class="assistant-line"></p>
    <p id="user-line" class="user-line"></p>
    <div class="controls">
      <button id="mic-btn" aria-label="Toggle voice control">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/>
        </svg>
      </button>
      <input id="text-input" type="text" placeholder='or type: "Tokyo for 5 days"' autocomplete="off">
      <button id="send-btn" aria-label="Send">→</button>
    </div>
    <p id="mic-note" class="mic-note">Tap the mic once and just talk — it keeps listening until you tap it again.</p>
  </section>

  <div id="tripbar"></div>
  <section id="stats"></section>
  <section id="challenges"></section>
  <section id="checklist"></section>
</main>

<footer>
  <p>Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Voice by the Web Speech API · No account, no keys, no tracking — your trip stays in your browser.</p>
</footer>

<script src="js/packing.js"></script>
<script src="js/voice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
